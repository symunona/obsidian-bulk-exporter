name: Release

# Triggered by scripts/release.sh pushing a BARE version tag (2.0.16, no leading
# "v"). Obsidian's plugin release checker requires the tag to equal the version
# in manifest.json exactly, so the pattern below deliberately has no "v".
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

# Only the release upload needs write access; nothing else here touches the repo.
permissions:
  contents: write
  id-token: write      # provenance signing
  attestations: write  # attaching attestations to the release

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version pin here on purpose: pnpm/action-setup reads the exact
      # version from package.json's "packageManager" field. That keeps CI and
      # every dev machine on one pnpm, so pnpm-lock.yaml's lockfileVersion
      # (9.0, written by pnpm 10) can never drift away from what CI installs
      # with --frozen-lockfile.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the contract with Obsidian's release checker: if it does not
      # match manifest.json, the plugin update is silently invisible to users.
      - name: Check tag matches manifest.json
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$manifest_version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}"
            exit 1
          fi
          echo "manifest.json version ${manifest_version} matches the tag"

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc -noEmit -skipLibCheck

      - name: Test
        run: pnpm exec jest --ci

      - name: Build
        run: node esbuild.config.mjs production

      - name: Check release artifacts exist
        run: |
          for f in main.js manifest.json styles.css; do
            test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
          done
          ls -l main.js manifest.json styles.css

      # Provenance attestations: proves the artifacts were built by this
      # workflow from this tag. Community plugin review asks for these.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # main.js / manifest.json / styles.css must be individual assets on the
      # release - Obsidian downloads them by name, a zip is not accepted.
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
